<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP | Jacqueline & Daniel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body class="bg-accent min-h-screen flex flex-col">
    <custom-navbar></custom-navbar>
    
    <main class="flex-grow py-16">
        <div class="container mx-auto px-4">
            <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
                <div class="bg-primary text-black p-6 text-center">
                    <h1 class="text-3xl font-serif mb-2">RSVP</h1>
                    <p class="opacity-90">Bitte antwortet bis zum 15.02</p>
                </div>
                
                <form id="rsvpForm" class="p-6">
                    <div class="mb-6">
                        <label class="block text-gray-700 mb-2">Bist du dabe?</label>
                        <div class="flex gap-4">
                            <label class="inline-flex items-center">
                                <input type="radio" name="attending" value="yes" class="h-4 w-4 text-primary" checked>
                                <span class="ml-2">Ja, ich/wir bin/sind dabei</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="attending" value="no" class="h-4 w-4 text-primary">
                                <span class="ml-2">Leider muss ich absagen</span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="mb-6">
                        <label for="name" class="block text-gray-700 mb-2">Name *</label>
                        <input type="text" id="name" required class="w-full px-3 py-2 border rounded-md">
                    </div>
                    
                    <div class="mb-6">
                        <label for="email" class="block text-gray-700 mb-2">Mail Addresse*</label>
                        <input type="email" id="email" required class="w-full px-3 py-2 border rounded-md">
                    </div>
                    
                    <div class="mb-6">
                        <label for="guests" class="block text-gray-700 mb-2">Anzahl der Gäste*</label>
                        <select id="guests" required class="w-full px-3 py-2 border rounded-md">
                            <option value="1">1</option>
                            <option value="2" selected>2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                    
                    <div class="mb-6">
                        <label for="message" class="block text-gray-700 mb-2">Nachricht für das Brautpaar</label>
                        <textarea id="message" rows="3" class="w-full px-3 py-2 border rounded-md"></textarea>
                    </div>
                    
                    <div class="flex justify-center">
                        <button type="submit" class="bg-primary hover:bg-primary/90 text-black px-8 py-3 rounded-full font-medium transition-all">Abschicken</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <custom-footer></custom-footer>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
        
        // Toggle meal options based on attendance
        const attendingRadios = document.querySelectorAll('input[name="attending"]');
        const attendingOnly = document.querySelectorAll('.attending-only');
        
        function updateAttendance() {
            const isAttending = document.querySelector('input[name="attending"]:checked').value === 'yes';
            attendingOnly.forEach(el => {
                el.style.display = isAttending ? 'block' : 'none';
            });
        }
        
        attendingRadios.forEach(radio => {
            radio.addEventListener('change', updateAttendance);
        });
        
        // Initialize
        updateAttendance();
        
        // Handle form submission
        document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Get form values
            const attending = document.querySelector('input[name="attending"]:checked').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const guests = parseInt(document.getElementById('guests').value);
            const message = document.getElementById('message').value;
            
            const submitButton = this.querySelector('button[type="submit"]');
            const originalText = submitButton.textContent;
            submitButton.disabled = true;
            submitButton.textContent = 'Sende...';
            
            try {
                const response = await fetch('https://giemsahomeserver.de/rsvps', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        attending,
                        name,
                        email,
                        guests,
                        message
                    })
                });

                if (!response.ok) {
                    throw new Error('Fehler beim Speichern der Rückmeldung.');
                }

                // Show confirmation
                if (attending === 'yes') {
                    alert(`Danke für deine Zusage, ${name}! Wir freuen uns darauf, mit dir zu feiern.`);
                } else {
                    alert(`Danke für deine Rückmeldung, ${name}. Schade, dass du nicht dabei sein kannst!`);
                }
                
                // Reset form
                this.reset();
                updateAttendance();
            } catch (error) {
                console.error('Error:', error);
                alert('Es gab ein Problem beim Senden deiner Antwort. Bitte versuche es später erneut.');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = originalText;
            }
        });
    </script>
</body>
</html>
